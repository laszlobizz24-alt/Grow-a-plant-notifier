name: Grow a Plant Egg Notifier

'on':
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "*/15 * * * *"

jobs:
  run-notifier:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run notifier
        run: python main.py

      - name: Test Discord webhook
        if: github.event_name == 'workflow_dispatch'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python -c "import os,requests; u=os.getenv('DISCORD_WEBHOOK_URL'); assert u, 'Missing DISCORD_WEBHOOK_URL secret'; r=requests.post(u,json={'content':'🌱 Grow a Plant Notifier: Discord connection successful!'},timeout=20); r.raise_for_status(); print('Discord message sent successfully!')"
